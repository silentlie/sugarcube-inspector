name: Temporary Tree Reconciliation Benchmark

on:
  push:
    branches: [feat/direct-main-world-inspector-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SC_TREE_BENCH: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx vitest run src/inspector/treeReconcile.bench.test.ts --reporter verbose
