name: Browser Tree A/B

on:
  push:
    branches: [feat/direct-main-world-inspector]
    paths:
      - src/inspector/VariableTree.tsx
      - src/inspector/VariableNodeContent.tsx
      - tests/browser/tree-update-ab.mjs
      - .github/workflows/tree-update-ab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tree-update-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - name: Benchmark immutable versus mutable extension
        run: npm run bench:tree:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-tree-ab
          path: tests/browser/.results/
          if-no-files-found: ignore
          retention-days: 14
