name: Inspector Cost Benchmark

on:
  push:
    branches: [feat/direct-main-world-inspector-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare-costs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - run: npm run build:benchmark
      - run: node tests/browser/prepare-story.mjs
      - run: npx playwright test --config playwright.cost.config.ts
        env:
          SC_INSPECTOR_COST_TEST: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspection-cost-results
          path: test-results/inspection-cost-*.json
          if-no-files-found: warn
          retention-days: 14
