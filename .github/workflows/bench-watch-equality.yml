name: Watch equality benchmark

on:
  push:
    branches: [feat/selective-variable-watch]
    paths:
      - "scripts/bench-watch-equality.cjs"
      - "src/sugarcube/watchService.ts"
      - ".github/workflows/bench-watch-equality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install benchmark-only libraries
        run: npm install --no-save --package-lock=false --ignore-scripts fast-equals@6.1.1 fast-deep-equal@3.1.3 dequal@2.0.3
      - name: Run correctness-gated benchmarks
        run: |
          node scripts/bench-watch-equality.cjs /tmp/watch-equality-results.json
          cat /tmp/watch-equality-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: watch-equality-results
          path: /tmp/watch-equality-results.json
