name: Refresh MUI dependency lockfile

on:
  push:
    branches: [feat/direct-main-world-inspector-poc]
    paths:
      - .github/workflows/lockfile-once.yml

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile and delete this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/lockfile-once.yml
          git commit -m "chore: lock MUI Community dependencies"
          git push origin HEAD:feat/direct-main-world-inspector-poc
