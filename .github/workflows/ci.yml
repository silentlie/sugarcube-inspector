name: CI

on:
  push:
    branches: [main, feat/direct-main-world-inspector-poc]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, TypeScript, integration, and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Emit lockfile for synchronization
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const src = fs.readFileSync('package-lock.json', 'utf8');
          console.log('LOCKFILE_BEGIN');
          for (let i = 0; i < src.length; i += 1800) {
            console.log('LOCKFILE_CHUNK:' + JSON.stringify(src.slice(i, i + 1800)));
          }
          console.log('LOCKFILE_END');
          NODE

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run compile

      - name: Run unit and integration tests
        run: npm test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium --no-shell

      - name: Build extension and run browser smoke tests
        run: npm run test:browser

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
