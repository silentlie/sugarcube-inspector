name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: TypeScript, integration, and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run compile

      - name: Run unit and integration tests
        run: npm test

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium --no-shell

      - name: Build extension and run browser smoke tests
        run: npm run test:browser

      - name: Upload browser failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  benchmark-watch-variants:
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/selective-variable-watch'
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate comparison variants
        run: npm test -- src/sugarcube/watchEqual.test.ts src/sugarcube/watchPollingVariants.test.ts
      - name: Install benchmark-only comparator libraries
        run: npm install --no-save --package-lock=false --ignore-scripts fast-equals@6.1.1 fast-deep-equal@3.1.3 dequal@2.0.3 esbuild@0.25.12
      - name: Compare detection variants against libraries
        run: npm run bench:watch:equality -- /tmp/watch-variants-equality.json
      - name: Benchmark worker-thread round trips
        run: npm run bench:watch:variants -- /tmp/watch-variants-worker.json
      - name: Install browser
        run: npx playwright install --with-deps chromium --no-shell
      - name: Benchmark Chromium MAIN and isolated world RPC
        run: npm run bench:watch:chromium -- /tmp/watch-variants-chromium.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: watch-variant-benchmark-results
          path: |
            /tmp/watch-variants-equality.json
            /tmp/watch-variants-worker.json
            /tmp/watch-variants-chromium.json
          if-no-files-found: warn
          retention-days: 7
