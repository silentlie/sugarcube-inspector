name: Temporary Tree End-to-End Benchmark

on:
  push:
    branches: [feat/direct-main-world-inspector-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      BENCH_REPEATS: "5"
      BENCH_SIZES: "200,2000,10000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - name: Benchmark legacy versus structurally shared tree
        run: node scripts/benchmark-tree-e2e.mjs
      - name: Upload raw timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tree-e2e-results
          path: benchmark-results/
          if-no-files-found: ignore
