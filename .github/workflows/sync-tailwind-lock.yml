name: Sync Tailwind Lockfile (temporary)
on:
  push:
    branches: [feat/direct-main-world-inspector]
    paths: [".github/workflows/sync-tailwind-lock.yml"]
permissions:
  contents: write
jobs:
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/direct-main-world-inspector
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: lock Tailwind v4 dependencies"
          git push origin HEAD:feat/direct-main-world-inspector
