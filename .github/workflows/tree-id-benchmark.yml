name: Numeric Tree ID A/B Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tree-id-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compare:
    name: Browser lifecycle comparison
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CI: "true"
      COST_SIZES: "200,2000,10000"
      COST_REPEATS: "3"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --no-shell

      - name: Measure baseline string IDs
        run: |
          git worktree add --detach ../tree-id-baseline b4c3294b949a45546fd23ec8f9aea09fcf28443a
          ln -s "$GITHUB_WORKSPACE/node_modules" ../tree-id-baseline/node_modules
          (cd ../tree-id-baseline && npm run benchmark:lifecycle)
          mkdir -p benchmark-results/tree-ids
          cp ../tree-id-baseline/benchmark-results/lifecycle.json benchmark-results/tree-ids/baseline.json
          git worktree remove --force ../tree-id-baseline

      - name: Measure numeric IDs
        run: |
          npm run benchmark:lifecycle
          cp benchmark-results/lifecycle.json benchmark-results/tree-ids/numeric.json

      - name: Summarize comparison
        run: |
          node scripts/compare-tree-id-benchmarks.mjs \
            benchmark-results/tree-ids/baseline.json \
            benchmark-results/tree-ids/numeric.json \
            benchmark-results/tree-ids/comparison.md
          cat benchmark-results/tree-ids/comparison.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw samples and comparison
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: numeric-tree-id-ab
          path: benchmark-results/tree-ids/
          if-no-files-found: ignore
          retention-days: 14
