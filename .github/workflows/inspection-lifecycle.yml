name: Temporary Inspection Lifecycle Cost Benchmark

on:
  push:
    branches: [feat/direct-main-world-inspector-poc]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      CI: "true"
      COST_REPEATS: "4"
      COST_SIZES: "200,2000,10000"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium --no-shell
      - name: Measure inspection lifecycle
        run: node scripts/benchmark-inspection-lifecycle.mjs
      - name: Upload lifecycle timing data
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inspection-lifecycle-results
          path: benchmark-results/
          if-no-files-found: ignore
